<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafrex/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and puts it in the url as parameter.
      // Then it redirects to the index.html with this new query string.
      // For example: /foo?bar=baz becomes /index.html?p=/foo&bar=baz
      // This prevents having to modify the built assets with special routes.
      var path = window.location.pathname;
      var query = window.location.search;
      var newUrl = window.location.protocol + "//" + window.location.host + "/WeightSystemChickens" + "/index.html?p=" + path + query;
      window.location.replace(newUrl);
    </script>
  </head>
  <body>
  </body>
</html>
